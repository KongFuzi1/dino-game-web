<!DOCTYPE html>
<html lang="en">
   <head>
      <title>Floppy Bird</title>
      <meta http-equiv="content-type" content="text/html; charset=utf-8" />
      <meta name="author" content="Nebez Briefkani" />
      <meta name="description" content="play floppy bird. a remake of popular game flappy bird built in html/css/js" />
      <meta name="keywords" content="flappybird,flappy,bird,floppybird,floppy,html,html5,css,css3,js,javascript,jquery,github,nebez,briefkani,nebezb,open,source,opensource" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />

      <!-- Open Graph tags -->
      <meta property="og:title" content="Floppy Bird" />
      <meta property="og:description" content="play floppy bird. a remake of popular game flappy bird built in html/css/js" />
      <meta property="og:type" content="website" />
      <meta property="og:image" content="https://nebezb.com/floppybird/assets/thumb.png" />
      <meta property="og:url" content="https://nebezb.com/floppybird/" />
      <meta property="og:site_name" content="Floppy Bird" />

      <!-- Style sheets -->
      <base href="/static/flappy/">
      <link href="css/reset.css" rel="stylesheet">
      <link href="css/main.css" rel="stylesheet">
      <style>
        #save { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: none; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: #ded895; border-top: 3px solid #543847; font-family: system-ui, sans-serif; }
        #save.show { display: flex; }
        #save input { flex: 1; min-width: 0; font-size: 1.1rem; padding: 10px; border: 2px solid #543847; border-radius: 6px; background: #fff; }
        #save button { font-size: 1.1rem; padding: 10px 16px; border: 2px solid #543847; border-radius: 6px; background: #f8b733; color: #543847; font-weight: 700; }
        #msg { position: fixed; left: 0; right: 0; top: 0; z-index: 50; display: none; padding: 10px 16px; text-align: center; font: 700 1rem system-ui, sans-serif; }
        #msg.ok { display: block; background: #d9f2e3; color: #1b7a3e; }
        #msg.bad { display: block; background: #fde2e2; color: #b00020; }
        #boardlink { position: fixed; right: 10px; top: 10px; z-index: 49; font: 700 .85rem system-ui, sans-serif; color: #543847; background: #f8b733aa; padding: 6px 10px; border-radius: 6px; text-decoration: none; }
      </style>

   </head>
   <body>
      <div id="gamecontainer">
         <div id="gamescreen">
            <div id="sky" class="animated">
               <div id="flyarea">
                  <div id="ceiling" class="animated"></div>
                  <!-- This is the flying and pipe area container -->
                  <div id="player" class="bird animated"></div>

                  <div id="bigscore"></div>

                  <div id="splash"></div>

                  <div id="scoreboard">
                     <div id="medal"></div>
                     <div id="currentscore"></div>
                     <div id="highscore"></div>
                     <div id="replay"><img src="assets/replay.png" alt="replay"></div>
                  </div>

                  <!-- Pipes go here! -->
               </div>
            </div>
            <div id="land" class="animated"><div id="debug"></div></div>
         </div>
      </div>
      <div id="footer">
         <a href="https://www.dotgears.com/">original game/concept/art by dong nguyen</a>
         <a href="https://nebezb.com/">recreated by nebez briefkani</a>
         <a href="https://github.com/nebez/floppybird/">view github project</a>
      </div>
      <div id="msg"></div>
      <a id="boardlink" href="/board">Edetabel</a>
      <form id="save" autocomplete="off">
         <input id="name" maxlength="16" placeholder="Sinu nimi" required>
         <button type="submit">Salvesta</button>
      </form>
      <div class="boundingbox" id="playerbox"></div>
      <div class="boundingbox" id="pipebox"></div>

      <script src="js/jquery.min.js"></script>
      <script src="js/jquery.transit.min.js"></script>
      <script src="js/buzz.min.js"></script>
      <script src="js/main.js"></script>
      <script src="/static/hook.js"></script>
   </body>
</html>

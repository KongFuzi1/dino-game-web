<script>
(() => {
  // Settings from Ansible (roles/dino/templates/config.json.j2); defaults are harder than stock Chrome.
  let pollMs = 5000;
  Runner.config.ACCELERATION = 0.0025;
  Runner.config.MAX_SPEED = 20;
  fetch('/config.json').then(r => r.json()).then(c => {
    if (c.acceleration) Runner.config.ACCELERATION = +c.acceleration;
    if (c.max_speed) Runner.config.MAX_SPEED = +c.max_speed;
    if (c.poll_interval_ms) pollMs = +c.poll_interval_ms;
    if (c.title) { document.title = c.title; document.querySelectorAll('h1, h2').forEach(h => h.textContent = c.title); }
  }).catch(() => {});

  const $ = id => document.getElementById(id);
  const game = $('game'), hint = $('hint'), statusEl = $('status'), board = $('board'), who = $('who');
  const nameov = $('nameov'), nameform = $('nameform'), nameEl = $('name');
  let playerName = '', lastScore = null;
  try { playerName = localStorage.getItem('dino_name') || ''; } catch (e) {}
  nameEl.value = playerName;

  // ---- name first ----
  nameov.classList.add('show');
  ['keydown', 'keyup', 'touchstart', 'mousedown'].forEach(t => nameov.addEventListener(t, e => e.stopPropagation()));
  nameform.addEventListener('submit', e => {
    e.preventDefault();
    playerName = nameEl.value.trim(); if (!playerName) return;
    try { localStorage.setItem('dino_name', playerName); } catch (e) {}
    who.textContent = playerName; nameov.classList.remove('show'); nameEl.blur();
    setTimeout(() => press({ preventDefault() {} }), 150);   // start right away
  });
  who.addEventListener('click', () => { nameov.classList.add('show'); nameEl.focus(); });

  // ---- input: the stock runner only listens to the keyboard (desktop) or a page-sized touch
  // overlay (mobile). Replace both with one handler on the game area. ----
  Runner.prototype.createTouchController = function () {};
  // Chromium's "arcade mode" rescales and repositions the canvas for a full-page layout; not here.
  Runner.prototype.setArcadeMode = function () {};
  Runner.prototype.setArcadeModeContainerScale = function () {};
  Runner.prototype.startListening = function () { document.addEventListener('keydown', this); document.addEventListener('keyup', this); };
  Runner.prototype.stopListening = function () { document.removeEventListener('keydown', this); document.removeEventListener('keyup', this); };
  const fake = (type, keyCode = 0) => ({ type, keyCode, target: game, currentTarget: game, preventDefault() {} });
  const press = e => {
    const r = Runner.instance_; if (!r || !r.tRex || nameov.classList.contains('show')) return;
    e.preventDefault();
    if (r.crashed) { if (Date.now() - r.time > 750) r.restart(); return; }
    r.onKeyDown(fake('touchstart'));
  };
  const release = () => { const r = Runner.instance_; if (r && !r.crashed) r.onKeyUp(fake('touchend')); };
  game.addEventListener('touchstart', press, { passive: false });
  game.addEventListener('touchend', release);
  game.addEventListener('mousedown', press);
  game.addEventListener('mouseup', release);

  // Duck = down arrow (keyCode 40) for the runner; while airborne it becomes a fast drop.
  const duckDown = () => { const r = Runner.instance_; if (r && r.playing && !r.crashed) r.onKeyDown(fake('keydown', 40)); };
  const duckUp = () => { const r = Runner.instance_; if (r && r.tRex) r.onKeyUp(fake('keyup', 40)); };
  // Swipe down on the game area ducks until the finger lifts.
  let touchY = null, ducking = false;
  game.addEventListener('touchstart', e => { touchY = e.touches[0].clientY; ducking = false; }, { passive: true });
  game.addEventListener('touchmove', e => {
    if (touchY !== null && !ducking && e.touches[0].clientY - touchY > 30) { ducking = true; duckDown(); }
  }, { passive: true });
  game.addEventListener('touchend', () => { if (ducking) duckUp(); ducking = false; touchY = null; });
  // Touch-only buttons.
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) document.body.classList.add('touch');
  const btnJump = $('btnJump'), btnDuck = $('btnDuck');
  btnJump.addEventListener('pointerdown', press); btnJump.addEventListener('pointerup', release); btnJump.addEventListener('pointercancel', release);
  btnDuck.addEventListener('pointerdown', e => { e.preventDefault(); duckDown(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => btnDuck.addEventListener(t, duckUp));
  // Space must not start a game while the name dialog is up.
  document.addEventListener('keydown', e => { if (nameov.classList.contains('show')) e.stopImmediatePropagation(); }, true);

  // ---- game over: save with the game's own score formula, then refresh the board ----
  const origGameOver = Runner.prototype.gameOver;
  Runner.prototype.gameOver = function () {
    origGameOver.apply(this, arguments);
    const score = Math.round(this.distanceRan * this.distanceMeter.config.COEFFICIENT);
    lastScore = score;
    hint.textContent = `Score ${score}. Tap the game to play again.`;
    fetch('/api/scores', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: playerName, score }) })
      .then(r => r.json())
      .then(j => setStatus(j.ok ? `${playerName}: ${score} points, rank #${j.rank}` : 'Database not responding: ' + j.error, j.ok))
      .catch(() => setStatus('Server not responding', false))
      .then(loadBoard);
  };
  const origRestart = Runner.prototype.restart;
  Runner.prototype.restart = function () { hint.textContent = ''; return origRestart.apply(this, arguments); };

  function setStatus(msg, ok) { statusEl.textContent = msg; statusEl.className = 'status ' + (ok ? 'ok' : 'bad'); }
  const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  async function loadBoard() {
    try {
      const r = await fetch('/api/scores'), j = await r.json();
      if (!j.ok) { setStatus('Database not responding: ' + j.error, false); board.innerHTML = ''; return; }
      if (statusEl.className.includes('bad')) setStatus(`Database is back. ${j.total} scores.`, true);
      board.innerHTML = j.scores.map((s, i) => `<tr${s.name === playerName && s.score === lastScore ? ' class="you"' : ''}><td>${i + 1}</td><td>${esc(s.name)}</td><td>${s.score}</td></tr>`).join('');
    } catch (err) { setStatus('Server not responding', false); }
  }
  loadBoard(); (function tick() { setTimeout(() => { loadBoard(); tick(); }, pollMs); })();
})();
</script>
</body>
</html>
